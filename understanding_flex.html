<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .flexcontainer{
            height: 400px;
            width: 600px;
            border: 2px solid;
            background-color: rgb(236, 176, 98);
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            flex-wrap: wrap;

        }

        .flexitem{
            height: 80px;
            width: 80px;
            border: 1px solid;
            background-color: brown;
        }
    </style>
</head>
<body>

    <div class ="flexcontainer">
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div>
        <div class="flexitem"></div>
        <div class="flexitem"></div><div class="flexitem"></div>

        <div class="flexitem"></div>

    </div>


    
</body>
</html>
