<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box inline</title>

    <style>
        .mainbox{
            width: 550px;
            height: 205px;
            background-color: rgb(206, 206, 139);
            padding: 5px;
        }

        .short_box{
            display: inline-block;
            width: 150px;
            height: 100px;
            background-color: rgb(190, 67, 67);

        }

        .mid_box{
            display: inline-block;
            width: 395px;
            height: 100px;
            background-color: rgb(209, 66, 66);

        }

        .big_box{
            padding: 5px;
            display: inline-block;
            width: 540px;
            height: 90px;
            background-color: rgb(217, 67, 67);
            margin-bottom: 5px;


        }

       .big_box_inbox{
         display: inline-block;
            
            width: 85px;
            height: 85px;
            background-color: rgb(217, 164, 164);

            
        }
    </style>
</head>
<body>
    <div class="mainbox">
        <div class="big_box">
             <div class="big_box_inbox"></div>
              <div class="big_box_inbox"></div>
               <div class="big_box_inbox"></div>
                <div class="big_box_inbox"></div>
                <div class="big_box_inbox"></div>
                <div class="big_box_inbox"></div>
        </div>
        <div class="mid_box"></div>
        <div class="short_box"></div>
        
        
        
    </div>
    
</body>
</html>
