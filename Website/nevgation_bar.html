<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Navigation Bar</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background-color:#0a0a0a;
}

/* ================= NAVBAR ================= */

.navContainer{
    width:100%;
    height:80px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    background:linear-gradient(90deg,#0f0f0f,#1c1c1c);

    border-bottom:2px solid #ff4d00;

    box-shadow:0 4px 15px rgba(255,77,0,0.3);
}

/* ================= LOGO ================= */

.logo{
    width:60px;
    height:60px;

    border-radius:50%;

    background-image:url(diablo_pic.jpg);
    background-size:cover;
    background-position:center;

    border:2px solid #ff4d00;

    box-shadow:0 0 15px #ff4d00;
}

/* ================= NAV LINKS ================= */

.anchorUL{
    display:flex;
    gap:40px;

    list-style:none;
}

.anchorUL a{
    text-decoration:none;
    color:#f5f5f5;

    font-size:18px;
    font-weight:bold;

    transition:0.3s;
}

.anchorUL a:hover{
    color:#ff4d00;

    text-shadow:0 0 10px #ff4d00;
}

/* ================= SEARCH SECTION ================= */

.serchDiv{
    display:flex;
    align-items:center;
    gap:10px;
}

/* INPUT */

.input{
    width:220px;
    height:38px;

    padding-left:15px;

    border:none;
    border-radius:20px;

    outline:none;

    background:#2a2a2a;
    color:white;

    border:1px solid #ff4d00;

    transition:0.3s;
}

.input:focus{
    box-shadow:0 0 10px #ff4d00;
}

.input::placeholder{
    color:#bbb;
}

/* SEARCH ICON */

.inputCircle{
    width:35px;
    height:35px;

    background:#ff4d00;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:18px;

    cursor:pointer;

    box-shadow:0 0 10px #ff4d00;

    transition:0.3s;
}

.inputCircle:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #ff4d00;
}

.pattern{
    
}


</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navContainer">

    <!-- LOGO -->
    <div class="logo"></div>

    <!-- NAVIGATION LINKS -->
    <div class="anchors">

        <ul class="anchorUL">

            <li><a href="https://youtube.com/">Home</a></li>

            <li><a href="https://youtube.com/">Media</a></li>

            <li><a href="https://youtube.com/">Blogs</a></li>

            <li><a href="https://youtube.com/">About</a></li>

            <li><a href="https://youtube.com/">Contact</a></li>

        </ul>

    </div>

    <!-- SEARCH BAR -->

    <div class="serchDiv">

        <input 
        type="text" 
        class="input" 
        placeholder="Search..."
        >

        <div class="inputCircle">
            🔍
        </div>

    </div>

</div>

<div class="pattern">
    <div class="patternitem"></div>
    <div class="patternitem"></div>
    <div class="patternitem"></div>
    <div class="patternitem"></div>
    
</div>

</body>
</html>
