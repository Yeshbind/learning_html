<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nevgation</title>
    <style>
        *{
            background-color: bisque;
            height: 3000px;
        }
        .nevgation{
            position: absolute;
            height: 100px;
            width: 100%;
            /* background-color: rgb(43, 226, 171); */
            border: 1px solid;
            padding: 40px;
           
        }

        .profile{
            margin-top: 10px;
            margin-left: 100px;
            height: 70px;
            width: 70px;
            border-radius: 50px;
            background-color: aquamarine;
            display: inline-block;
        }

        .box1,.box2,.box3,.box4{
            margin-left: 100px;
             height: 70px;
            width: 90px;
            background-color: aquamarine;
            display: inline-block;

        }
        .rec{
            margin-top: 10px;
            margin-left: 100px;
             height: 70px;
            width: 120px;
            background-color: aquamarine;
            display: inline-block;
        }

    </style>
</head>
<body >
    <div class ="nevgation">
        <div class ="profile"> </div>
        <div class ="box1"> </div>
        <div class ="box2"> </div>
        <div class ="box3"> </div>
        <div class ="rec"> </div>
        <div class ="box4"> </div>
        <div class ="profile"> </div>


    </div>
    
</body>
</html>
