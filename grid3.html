<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 100px 100px 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 5px;
        }

        .box1,.box2,.box6,.box3,.box4,.box5{
            background-color: brown;
        }
        .box1{
            grid-column: 1/3;
        }
        
        .box2{
            grid-column: 3/4;
            grid-row: 1/3;
        }
        .box3{
             grid-column: 4/5;

        }
        .box4{
            grid-column: 1/3;
        }
        .box6{
            grid-column: 1/5;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        
            <div class="box3"></div>
           <div class="box4" ></div>
           <div class="box5"></div>
           <div class="box6"></div>
        
          
    </div>
    
</body>
</html>
