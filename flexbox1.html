<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flexbox Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .container {
      display: flex;
      flex-direction: row;
      gap: 4px;
      width: 530px;
      height: 400px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .column.left {
      flex: 0 0 25%;
    }

    .column.right {
      flex: 1;
    }

    .box {
      background-color: #a03030;
      
    }

    .box.top {
      height: 100px;
    }

    .box.bottom {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="column left">
      <div class="box top"></div>
      <div class="box bottom"></div>
    </div>
    <div class="column right">
      <div class="box top"></div>
      <div class="box bottom"></div>
    </div>
  </div>

</body>
</html>
