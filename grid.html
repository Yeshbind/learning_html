<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Demo</title>

<style>
.container {
    width: 600px;
    margin: 50px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 80px 80px 80px;
    gap: 10px;
}

.a {
    background: rgb(133, 148, 195);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    grid-column: 1 / 3;
}

.b {
    background: rgb(198, 166, 107);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    grid-column: 1 / 3;
}

.c {
    background: rgb(159, 108, 172);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    grid-column: 3 / 4;
    grid-row: 1 / 3;
}

.d {
    background: rgb(136, 207, 200);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    grid-column: 4 / 5;
    grid-row: 1 / 2;
}

.e {
    background: rgb(223, 116, 116);
    display: flex;
    justify-content: center;
    align-items: center;

    grid-column: 4 / 5;
    grid-row: 2 / 3;
}

.f {
    background: rgb(160, 206, 222);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    /* full width */
    grid-column: 1 / 5;
}
</style>
</head>
<body>

<div class="container">
    <div class="a"></div>
    <div class="c"></div>
    <div class="d"></div>

    <div class="b"></div>
    <div class="e"></div>

    <div class="f">
    </div>
</div>

</body>
</html>
