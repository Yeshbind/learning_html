<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Physical Form</title>


    <style>
        input{
            border: none;
            outline: none;
            border-bottom: 2px dotted;
        }

    </style>

</head>
<body>

    <h2>Sports Physical Form</h2>


    <form >
        <fieldset>
            <legend> Athlete Information</legend>
            <UL>
                <li>
                    <lebel for="fname">Name:</lebel>

                    name="fname" 
                    placeholder="Enter your full name"/>

                <li>
                    <label for="School/Team">School/Team:</lebel>
                    <input
                    type="text" 
                    id="School/Team" 
                    name="School/Team" 
                    placeholder="School/Team name"/>
                </li>
                <li>
                    <label for="Sports">Sports:</lebel>
                    <input
                    type="text" 
                    id="Sports" 
                    name="Sports" 
                    placeholder="Sports name"/>
                </li>
                <li>
                    <label for="parent_name">Parent/Gaurdian Name:</lebel>
                    <input
                    type="text" 
                    id="parent_name" 
                    name="parent_name" 
                    placeholder="Parent/Gaurdian Name"/>
                </li>
                <li>
                    <label for="Contact">Contact Number:</lebel>
                    <input
                    type="text" 
                    id="Contact" 
                    name="Contact" 
                    placeholder="Contact Number"/>
                </li>
            </UL>
        </fieldset>
        <fieldset>
             <legend> Medical History for Athletes </legend>

        </fieldset>
        <fieldset>
             <legend> Fitness Assessment</legend>

        </fieldset>
        <fieldset>

        </fieldset>
    </form>
    
</body>
</html>
