<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Center</title>

<style>

    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f5f5f5;
    }

    .wrapper{
        display:flex;
        flex-direction:column;
        gap:5px;
    }

    .header_menu,
    .navgation_menu,
    .footer{
        width:200px;
        height:50px;
        border: 1px solid;
    }

    .header_menu{
        background:rgba(224, 40, 40, 0.564);
    }

    .navgation_menu{
        background:rgba(209, 229, 58, 0.56);
    }

    .content{
        display:flex;
        gap:5px;
    }

    .main{
        width:110px;
        height:100px;
        background:rgba(57, 190, 239, 0.559);

        display:flex;
        gap:5px;
        padding:5px;
        box-sizing:border-box;
        border: 1px solid;
    }

    .article,
    .section{
        width:50px;
        height:85px;
        background:rgba(52, 129, 157, 0.638);
        border: 1px solid;
    }

    .aside{
        width:85px;
        height:100px;
        background:rgba(71, 200, 48, 0.629);
        border: 1px solid;
    }

    .footer{
        background:rgba(224, 40, 40, 0.564);
    }

</style>
</head>

<body>

<div class="wrapper">

    <div class="header_menu"></div>

    <div class="navgation_menu"></div>

    <div class="content">
        <div class="main">
            <div class="article"></div>
            <div class="section"></div>
        </div>

        <div class="aside"></div>
    </div>

    <div class="footer"></div>

</div>

</body>
</html>
